name: Release

# A tag v1.2.3 builds, tests and publishes a GitHub release with the CLI
# tarball, the web editor bundle and (once it exists) the VS Code
# extension. Run it by hand for a dry run: the same artifacts, uploaded to
# the workflow run instead of a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Check the tag matches the package version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./packages/cli/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          }
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" release/*
          --title "$GITHUB_REF_NAME" --generate-notes
